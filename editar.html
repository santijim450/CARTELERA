<!DOCTYPE html>
<html lang="es">
<head>
 <meta charset="UTF-8">
 <title>Editar Película</title>
 <style>
    body { font-family: sans-serif; background-color: #f8f9fa; margin: 0; padding: 20px; color: #333; }
    .nav-menu { margin-bottom: 20px; padding-bottom: 15px; border-bottom: 2px solid #ddd; }
    .nav-menu a { text-decoration: none; color: #333; font-weight: bold; font-size: 1.1em; }
    
    .contenedor-formulario { background: white; border: 1px solid #eaeaea; border-radius: 8px; padding: 40px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); max-width: 500px; margin: 40px auto; text-align: center; }
    .contenedor-formulario h2 { margin-top: 0; color: #111; }
    
    .portada-preview { max-width: 150px; border-radius: 5px; margin-bottom: 20px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
    
    .grupo-input { margin-bottom: 20px; text-align: left; }
    .grupo-input label { display: block; margin-bottom: 8px; font-weight: bold; }
    .grupo-input input { width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 5px; font-size: 1em; box-sizing: border-box; }
    
    .btn-guardar { background: #111; color: white; border: none; padding: 15px 20px; width: 100%; border-radius: 5px; font-size: 1.1em; cursor: pointer; font-weight: bold; }
    .btn-guardar:hover { background: #333; }
 </style>
</head>
<body>
 <div class="nav-menu">
    <a href="index.html">Cancelar y Volver a Mi Cartelera</a>
 </div>

 <div class="contenedor-formulario">
    <h2>Editar Detalles</h2>
    
    <img id="imagenPreview" class="portada-preview" src="" alt="Cargando portada..." style="display: none;">
    
    <form id="forma">
        <input type="hidden" id="id" name="id">
        
        <div class="grupo-input">
            <label for="titulo">Título</label>
            <input type="text" id="titulo" name="titulo" required>
        </div>
        
        <div class="grupo-input">
            <label for="genero">Género</label>
            <input type="text" id="genero" name="genero" required>
        </div>
        
        <button type="submit" class="btn-guardar">Guardar Cambios</button>
    </form>
 </div>

 <script type="module">
  import { consume } from "./js/lib/consume.js"
  import { recibeJson } from "./js/lib/recibeJson.js"
  import { muestraError } from "./js/lib/muestraError.js"
  import { enviaJsonRecibeJson } from "./js/lib/enviaJsonRecibeJson.js"

  const forma = document.getElementById("forma");
  forma.addEventListener("submit", guardaCambios);

  window.onload = async () => {
      const parametros = new URLSearchParams(window.location.search);
      const id = parametros.get("id");
      
      if (!id) return alert("No se especificó qué película editar.");

      try {
          const respuesta = await consume(recibeJson(`php/recupera_pelicula.php?id=${id}`));
          const pelicula = await respuesta.json();

          document.getElementById("id").value = pelicula.id;
          document.getElementById("titulo").value = pelicula.titulo;
          document.getElementById("genero").value = pelicula.genero;
          
          const imgPreview = document.getElementById("imagenPreview");
          imgPreview.src = pelicula.imagen ? pelicula.imagen : 'https://via.placeholder.com/150x220?text=Sin+Imagen';
          imgPreview.style.display = "inline-block";

      } catch (error) {
          muestraError(error);
      }
  };

  async function guardaCambios(evento) {
   evento.preventDefault();
   try {
    const modelo = {
        id: document.getElementById("id").value,
        titulo: document.getElementById("titulo").value,
        genero: document.getElementById("genero").value
    };

    const respuesta = await consume(
        enviaJsonRecibeJson("php/edita_pelicula.php", modelo)
    );
    const json = await respuesta.json();
    alert(json.mensaje);
    window.location.href = "index.html"; 
   } catch (error) {
    muestraError(error);
   }
  }
 </script>
</body>
</html>
