<!DOCTYPE html>
<html lang="es">
<head>
 <meta charset="UTF-8">
 <title>Recomendaciones</title>
 <style>
    /* Estilos generales */
    body { font-family: sans-serif; background-color: #f8f9fa; margin: 0; padding: 20px; }
    
    /* Cuadrícula de tarjetas */
    .contenedor-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 20px;
      margin-top: 20px;
    }
    .tarjeta {
      border: 1px solid #e0e0e0;
      border-radius: 8px;
      padding: 15px;
      text-align: center;
      background-color: #fff;
      box-shadow: 0 4px 8px rgba(0,0,0,0.05);
    }
    .tarjeta img { max-width: 100%; border-radius: 5px; }
    .tarjeta h3 { font-size: 1.2em; margin: 10px 0 5px 0; color: #333; }
    .boton-obtener {
      background-color: #222; color: white; border: none; padding: 10px; 
      width: 100%; border-radius: 5px; margin-top: 10px; cursor: pointer;
    }
    .boton-obtener:hover { background-color: #444; }

    /* Estilos para la vista de detalle */
    #vistaDetalle { display: none; margin-top: 20px; }
    .detalle-contenedor {
      display: flex; gap: 30px; background: white; padding: 30px; 
      border-radius: 8px; box-shadow: 0 4px 8px rgba(0,0,0,0.1);
      flex-wrap: wrap; /* Para que se adapte a celulares */
    }
    .detalle-imagen img { border-radius: 8px; max-width: 300px; width: 100%; }
    .detalle-info h2 { font-size: 2em; margin-top: 0; color: #111; }
    .detalle-info p { font-size: 1.1em; color: #444; line-height: 1.6; }
    
    .btn-volver {
      background-color: #007bff; color: white; border: none; padding: 10px 20px; 
      border-radius: 5px; cursor: pointer; margin-bottom: 20px; font-size: 1em;
    }
    .btn-volver:hover { background-color: #0056b3; }
 </style>
</head>
<body>
 <h1>Recomendaciones Destacadas</h1>
 <a href="index.html" style="text-decoration: none; color: #007bff; font-weight: bold;">⬅ Volver a Mi Cartelera</a>
 <hr>
 
 <button id="btnBuscar" style="padding: 10px; cursor: pointer; background-color: #111; color: white; border: none; border-radius: 5px;">Cargar Recomendaciones</button>
 
 <div id="resultados" class="contenedor-grid"></div>

 <div id="vistaDetalle"></div>

 <script type="module">
  import { muestraError } from "./js/lib/muestraError.js"

  document.getElementById("btnBuscar").addEventListener("click", cargarTerceros);

  // Truco: Cargamos las recomendaciones automáticamente al entrar
  window.onload = cargarTerceros;

  async function cargarTerceros() {
   try {
    const respuesta = await fetch("https://api.tvmaze.com/shows");
    if (!respuesta.ok) throw new Error("Error al conectar con el servicio externo");
    
    const datos = await respuesta.json();
    const primeros12 = datos.slice(0, 12);
    
    let html = "";
    primeros12.forEach(item => {
        const imagenUrl = item.image ? item.image.medium : 'https://via.placeholder.com/210x295?text=Sin+Imagen';
        
        // ¡Magia aquí!: Le agregamos el atributo data-id al botón
        html += `
         <div class="tarjeta">
             <img src="${imagenUrl}" alt="Portada">
             <h3>${item.name}</h3>
             <p>⭐ ${item.rating.average || 'N/A'}</p>
             <button class="boton-obtener" data-id="${item.id}">Ver Detalles</button>
         </div>
        `;
    });
    
    document.getElementById("resultados").innerHTML = html;

   } catch (error) {
    muestraError(error);
   }
  }

  // Escuchamos los clics en todo el contenedor de resultados
  document.getElementById("resultados").addEventListener("click", async (evento) => {
      // Si el elemento clicado tiene la clase 'boton-obtener'
      if (evento.target.classList.contains("boton-obtener")) {
          const showId = evento.target.getAttribute("data-id");
          await cargarDetalle(showId);
      }
  });

  // Función para buscar el detalle usando el ID
  async function cargarDetalle(id) {
      try {
          const respuesta = await fetch(`https://api.tvmaze.com/shows/${id}`);
          if (!respuesta.ok) throw new Error("No se pudo cargar el detalle");
          
          const show = await respuesta.json();
          const imagenUrl = show.image ? show.image.original : 'https://via.placeholder.com/400x600?text=Sin+Imagen';
          
          // Ocultamos la lista y el botón de cargar
          document.getElementById("resultados").style.display = "none";
          document.getElementById("btnBuscar").style.display = "none";
          
          const vistaDetalle = document.getElementById("vistaDetalle");
          vistaDetalle.style.display = "block"; // Mostramos el contenedor de detalle

          // Inyectamos el HTML del detalle (incluye la sinopsis que viene en formato HTML desde la API)
          vistaDetalle.innerHTML = `
              <button class="btn-volver" id="btnVolver">⬅ Volver a recomendaciones</button>
              <div class="detalle-contenedor">
                  <div class="detalle-imagen">
                      <img src="${imagenUrl}" alt="${show.name}">
                  </div>
                  <div class="detalle-info">
                      <h2>${show.name}</h2>
                      <p><strong>Género:</strong> ${show.genres.join(", ") || 'No especificado'}</p>
                      <p><strong>Estreno:</strong> ${show.premiered || 'Desconocido'}</p>
                      <p><strong>Calificación:</strong> ⭐ ${show.rating.average || 'N/A'}</p>
                      <p><strong>Idioma Original:</strong> ${show.language}</p>
                      <div><strong>Sinopsis:</strong><br><br> ${show.summary || 'No hay descripción disponible.'}</div>
                  </div>
              </div>
          `;

          // Le damos funcionalidad al botón de volver
          document.getElementById("btnVolver").addEventListener("click", () => {
              vistaDetalle.style.display = "none";
              document.getElementById("resultados").style.display = "grid";
              document.getElementById("btnBuscar").style.display = "inline-block";
          });

      } catch (error) {
          muestraError(error);
      }
  }
 </script>
</body>
</html>
